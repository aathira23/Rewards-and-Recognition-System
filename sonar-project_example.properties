# Project identity
sonar.projectKey=your_project_key_here
sonar.projectName=your_project_name_here
sonar.projectVersion=1.0

# Source code location
sonar.sources=backend,frontend

# SonarQube server
sonar.host.url=http://localhost:9000
sonar.login=your_sonar_token_here

# Python specific
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Exclusions (important)
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.venv/**,**/venv/**,**/migrations/**