<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:auto">
  <h2>Verify your email address</h2>
  <p>Hi {{ user_name }},</p>
  <p>Click the button below to verify your email address. This link expires in 24 hours.</p>
  <p><a href="{{ verification_url }}" style="background:#4f46e5;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none">Verify Email</a></p>
  <p>If you did not request this, please ignore this email.</p>
  <hr>
  <p style="font-size:12px;color:#888">{{ org_name }} · <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
</body>
</html>
