<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>HR Alert – {{ org_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f0f2f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased">
  <div style="background:#f0f2f5;padding:40px 20px">
    <div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)">

      <div style="background:linear-gradient(135deg,#4338ca 0%,#6d28d9 100%);padding:26px 40px">
        <p style="margin:0;color:#ffffff;font-size:21px;font-weight:700;letter-spacing:-0.3px">{{ org_name }}</p>
      </div>

      <div style="padding:0 40px"><span style="display:inline-block;background:#fee2e2;color:#7f1d1d;font-size:11px;font-weight:700;padding:4px 12px;border-radius:0 0 8px 8px;letter-spacing:0.6px;text-transform:uppercase">Critical Alert</span></div>

      <div style="padding:34px 40px 30px">
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin-bottom:18px"><p style="margin:0;font-size:16px;font-weight:600;color:#991b1b">&#9888; {{ short_reason }}</p></div><p style="margin:0 0 14px;font-size:15px;color:#374151;line-height:1.65">Hi <strong>{{ user_name }}</strong>,</p><p style="margin:0 0 14px;font-size:15px;color:#374151;line-height:1.65">{{ detailed_message }}</p><p style="margin:22px 0 0"><a href="{{ frontend_url }}" style="display:inline-block;background:#b91c1c;color:#ffffff;padding:13px 26px;border-radius:6px;text-decoration:none;font-weight:600;font-size:15px">Open Dashboard</a></p>
      </div>

      <div style="background:#f8f9fa;padding:16px 40px;border-top:1px solid #e9ecef">
        <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center;line-height:1.6">
          &copy; {{ org_name }} &nbsp;&middot;&nbsp;
          <a href="mailto:{{ support_email }}" style="color:#6366f1;text-decoration:none">{{ support_email }}</a>
          &nbsp;&middot;&nbsp;
          <a href="{{ frontend_url }}" style="color:#6366f1;text-decoration:none">Open Dashboard</a>
        </p>
      </div>

    </div>
  </div>
</body>
</html>
