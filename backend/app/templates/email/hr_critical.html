<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:auto">
  <h2 style="color:#dc2626">⚠ HR Critical Alert</h2>
  <p>Hi {{ user_name }},</p>
  <p><strong>{{ alert_title }}</strong></p>
  <p>{{ alert_body }}</p>
  {% if action_url %}
  <p><a href="{{ action_url }}" style="background:#dc2626;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none">Take Action</a></p>
  {% endif %}
  <hr>
  <p style="font-size:12px;color:#888">{{ org_name }} · <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
</body>
</html>
