<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:auto">
  <h2>Your Points Are Expiring Soon</h2>
  <p>Hi {{ user_name }},</p>
  <p>You have <strong>{{ expiring_points }}</strong> points expiring on <strong>{{ expiry_date }}</strong>.</p>
  <p>Redeem them before they expire!</p>
  <p><a href="{{ frontend_url }}/store" style="background:#4f46e5;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none">Redeem Now</a></p>
  <hr>
  <p style="font-size:12px;color:#888">{{ org_name }} · <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
</body>
</html>
