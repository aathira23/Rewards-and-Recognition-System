<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:auto">
  <h2>Upcoming Celebration: {{ celebration_name }}</h2>
  <p>Hi {{ user_name }},</p>
  <p>A celebration event is coming up on <strong>{{ celebration_date }}</strong>.</p>
  {% if message %}
  <p>{{ message }}</p>
  {% endif %}
  <p><a href="{{ frontend_url }}/celebrations" style="background:#4f46e5;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none">View Celebrations</a></p>
  <hr>
  <p style="font-size:12px;color:#888">{{ org_name }} · <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
</body>
</html>
