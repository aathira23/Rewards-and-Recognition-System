<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:auto">
  <h2>Reset your password</h2>
  <p>Hi {{ user_name }},</p>
  <p>We received a request to reset your {{ org_name }} password. Click below to set a new one. The link expires in 1 hour.</p>
  <p><a href="{{ reset_url }}" style="background:#4f46e5;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none">Reset Password</a></p>
  <p>If you did not request a password reset, you can safely ignore this email.</p>
  <hr>
  <p style="font-size:12px;color:#888">{{ org_name }} · <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
</body>
</html>
