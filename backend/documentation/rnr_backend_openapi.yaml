openapi: 3.0.3
info:
  title: Rewards & Recognition System API
  description: >
    API endpoints for a complete Rewards and Recognition platform, covering user management,
    peer-to-peer eCard recognitions, formal award nominations with multi-level approvals,
    points wallets, catalog redemptions, celebrations, analytics, reports, and system
    configuration. All endpoints (except login and feature-flags) require a valid JWT
    Bearer token.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
security:
  - bearerAuth: []

paths:

  # ─────────────────────── AUTH ───────────────────────

  /auth/login:
    post:
      tags:
        - auth
      summary: Login
      description: Authenticates a user with email and password (OAuth2 form data). Returns a JWT access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginForm'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Login successful
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  token_type: bearer
                  user_id: 1
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ─────────────────────── PROFILE ───────────────────────

  /profile/me:
    get:
      tags:
        - profile
      summary: Get Current User Profile
      description: Returns the authenticated user's full profile details.
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: User profile retrieved
                data:
                  id: 1
                  name: "Alice Johnson"
                  email: "alice@company.com"
                  role: "EMPLOYEE"
                  department_id: 3
                  department_name: "Engineering"
                  manager_id: 5
                  manager_name: "Bob Smith"
                  date_of_joining: "2023-03-01"
                  birth_date: "1992-07-15"
                  created_at: "2023-03-01T09:00:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /profile/:
    get:
      tags:
        - profile
      summary: List All Users
      description: Returns a paginated list of all users. Visible to all authenticated users.
      operationId: listUsers
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Users retrieved
                data:
                  - id: 1
                    name: "Alice Johnson"
                    email: "alice@company.com"
                    role: "EMPLOYEE"
                    department_id: 3
                    date_of_joining: "2023-03-01"
                    created_at: "2023-03-01T09:00:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - profile
      summary: Create User
      description: Creates a new user account. The first user in the system can be created without authentication. After that, only HR/Admin can create users.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 201
                message: User created successfully
                data:
                  id: 10
                  name: "Carol White"
                  email: "carol@company.com"
                  role: "EMPLOYEE"
                  department_id: 2
                  created_at: "2025-01-15T10:30:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /profile/{user_id}:
    put:
      tags:
        - profile
      summary: Update User
      description: Updates a user's profile. Users can update their own profile; HR/Admin can update any user.
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: User updated successfully
                data:
                  id: 1
                  name: "Alice Johnson"
                  role: "MANAGER"
                  department_id: 3
                  updated: true
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ─────────────────────── BUDGETS / WALLETS ───────────────────────

  /budgets/manager:
    get:
      tags:
        - budgets
      summary: Get Manager Wallet
      description: Returns the authenticated manager's budget wallet balance.
      operationId: getManagerWallet
      responses:
        '200':
          description: Wallet retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Wallet retrieved
                data:
                  id: 7
                  user_id: 5
                  wallet_type: "MANAGER"
                  balance: 1500
                  created_at: "2024-01-01T00:00:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /budgets/manager/allocate:
    post:
      tags:
        - budgets
      summary: Allocate Budget to Manager
      description: HR allocates a points budget to a specific manager's wallet.
      operationId: allocateManagerBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAllocateRequest'
      responses:
        '200':
          description: Budget allocated
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Budget allocated successfully
                data:
                  manager_id: 5
                  points_allocated: 500
                  new_balance: 2000
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/manager/reward:
    post:
      tags:
        - budgets
      summary: Reward Employee
      description: Manager rewards an employee by transferring points from their budget wallet to the employee's wallet.
      operationId: rewardEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRewardRequest'
      responses:
        '200':
          description: Employee rewarded
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Employee rewarded successfully
                data:
                  batch_id: 42
                  employee_id: 8
                  points: 100
                  manager_wallet_balance: 1400
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /budgets/manager/bulk-allocate:
    post:
      tags:
        - budgets
      summary: Bulk Allocate Budget
      description: HR bulk-allocates a points budget to multiple managers, a department, or a role filter.
      operationId: bulkAllocateBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkBudgetAllocationRequest'
      responses:
        '200':
          description: Bulk allocation completed
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Bulk allocation completed
                data:
                  allocated_count: 12
                  points_per_manager: 500
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ─────────────────────── POINTS ───────────────────────

  /points/balance:
    get:
      tags:
        - points
      summary: Get Points Balance
      description: Returns the current user's points balance and aggregate statistics (earned, redeemed, converted, pending).
      operationId: getPointsBalance
      responses:
        '200':
          description: Points balance retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Points balance retrieved
                data:
                  balance: 850
                  total_earned: 1200
                  total_redeemed: 200
                  total_converted: 150
                  pending_count: 2
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /points/history:
    get:
      tags:
        - points
      summary: Get Points History
      description: Returns paginated points ledger history with optional filters.
      operationId: getPointsHistory
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            description: Filter by transaction category (EARNED, REDEEMED, EXPIRED, PENDING)
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: wallet_type
          in: query
          required: false
          schema:
            type: string
            default: EMPLOYEE
            enum: [EMPLOYEE, MANAGER]
      responses:
        '200':
          description: Points history retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Points history retrieved
                data:
                  balance: 850
                  total_earned: 1200
                  total_redeemed: 200
                  total_converted: 150
                  pending_count: 2
                  history:
                    - id: 101
                      points: 50
                      source: RECOGNITION
                      description: "Awarded by manager"
                      created_at: "2025-01-10T10:00:00"
                  page: 1
                  per_page: 20
                  total: 45
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /points/convert:
    post:
      tags:
        - points
      summary: Request Points Conversion
      description: Request conversion of accumulated points to cash or payroll. Feature flag `conversion_enabled` must be active.
      operationId: convertPoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointsConversionCreate'
      responses:
        '201':
          description: Conversion request created
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 201
                message: Conversion request submitted
                data:
                  id: 5
                  user_id: 1
                  points_converted: 500
                  conversion_type: CASH
                  cash_amount: 50.00
                  status: PENDING
                  requested_at: "2025-01-15T10:30:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /points/conversions:
    get:
      tags:
        - points
      summary: Get Conversion Requests
      description: HR/Admin see all conversion requests; regular users see only their own.
      operationId: getConversions
      responses:
        '200':
          description: Conversions retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Conversions retrieved
                data:
                  - id: 5
                    user_id: 1
                    user_name: "Alice Johnson"
                    points_converted: 500
                    conversion_type: CASH
                    cash_amount: 50.00
                    status: PENDING
                    requested_at: "2025-01-15T10:30:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /points/conversions/pending:
    get:
      tags:
        - points
      summary: Get Pending Conversions
      description: Returns all pending conversion requests (HR/Admin only).
      operationId: getPendingConversions
      responses:
        '200':
          description: Pending conversions retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Pending conversions retrieved
                data:
                  - id: 5
                    user_id: 1
                    user_name: "Alice Johnson"
                    points_converted: 500
                    conversion_type: CASH
                    cash_amount: 50.00
                    status: PENDING
                    requested_at: "2025-01-15T10:30:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /points/conversions/{conversion_id}/action:
    post:
      tags:
        - points
      summary: Approve or Reject Conversion
      description: HR/Admin approves or rejects a pending points conversion request.
      operationId: actionConversion
      parameters:
        - name: conversion_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionActionRequest'
      responses:
        '200':
          description: Action taken
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Conversion approved
                data:
                  id: 5
                  status: APPROVED
                  approved_by: 2
                  approved_by_name: "HR Manager"
                  approved_at: "2025-01-15T11:00:00"
                timestamp: "2025-01-15T11:00:00"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /points/rules:
    get:
      tags:
        - points
      summary: Get Points Rules
      description: Returns all points policy rules. HR/Admin see inactive rules too.
      operationId: getPointsRules
      responses:
        '200':
          description: Rules retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Policies retrieved
                data:
                  - id: 1
                    recognition_type: PEER
                    points_allocated: 50
                    conversion_rate: 0.10
                    is_active: true
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - points
      summary: Create Points Rule
      description: Create a new points policy rule (HR/Admin only).
      operationId: createPointsRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointsPolicyCreate'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 201
                message: Rule created
                data:
                  id: 5
                  recognition_type: AWARD
                  points_allocated: 200
                  is_active: true
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /points/rules/{rule_id}:
    put:
      tags:
        - points
      summary: Update Points Rule
      description: Update an existing points policy rule (HR/Admin only).
      operationId: updatePointsRule
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointsPolicyUpdate'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Rule updated
                data:
                  id: 5
                  is_active: false
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ─────────────────────── RECOGNITIONS (eCARDS) ───────────────────────

  /recognitions/:
    post:
      tags:
        - recognitions
      summary: Send eCard Recognition
      description: Sends a peer-to-peer eCard recognition with a message and a badge.
      operationId: sendRecognition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ECardCreate'
      responses:
        '201':
          description: eCard sent
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 201
                message: Recognition sent successfully
                data:
                  id: 88
                  sender:
                    id: 1
                    name: "Alice Johnson"
                    role: "EMPLOYEE"
                    department_name: "Engineering"
                  receiver:
                    id: 9
                    name: "David Lee"
                    role: "EMPLOYEE"
                    department_name: "Design"
                  badge:
                    id: 3
                    name: "Team Player"
                    icon_url: "https://cdn.example.com/badges/team-player.png"
                  message: "Great collaboration on the last sprint!"
                  created_at: "2025-01-15T10:30:00"
                timestamp: "2025-01-15T10:30:00"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /recognitions/feed:
    get:
      tags:
        - recognitions
      summary: Recognition Feed
      description: Returns the company-wide recognition feed in reverse chronological order with pagination.
      operationId: getRecognitionFeed
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Feed retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Feed retrieved
                data:
                  items:
                    - id: 88
                      event_type: ECARD
                      actor:
                        id: 1
                        name: "Alice Johnson"
                        department_name: "Engineering"
                      receiver:
                        id: 9
                        name: "David Lee"
                        department_name: "Design"
                      message: "Great collaboration!"
                      badge_name: "Team Player"
                      created_at: "2025-01-15T10:30:00"
                  page: 1
                  per_page: 20
                  total: 154
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /recognitions/me/overview:
    get:
      tags:
        - recognitions
      summary: My Recognition Overview
      description: Returns a summary of recognitions sent and received by the current user.
      operationId: getMyRecognitionOverview
      responses:
        '200':
          description: Overview retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Overview retrieved
                data:
                  received_count: 12
                  sent_count: 8
                  recent_received:
                    - sender_name: "Bob Smith"
                      badge_name: "Go-Getter"
                      message: "Excellent work!"
                      date: "2025-01-10T09:00:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /recognitions/leaderboard:
    get:
      tags:
        - recognitions
      summary: Recognition Leaderboard
      description: Returns a leaderboard of top recognized employees.
      operationId: getRecognitionLeaderboard
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            default: MONTHLY
            enum: [MONTHLY, YEARLY]
        - name: metric
          in: query
          required: false
          schema:
            type: string
            default: POINTS
            enum: [POINTS, COUNT]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Leaderboard retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Leaderboard retrieved
                data:
                  - rank: 1
                    user_id: 9
                    user_name: "David Lee"
                    department_name: "Design"
                    score: 350
                  - rank: 2
                    user_id: 1
                    user_name: "Alice Johnson"
                    department_name: "Engineering"
                    score: 280
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /recognitions/badges:
    get:
      tags:
        - recognitions
      summary: List Badges
      description: Returns all active badges. HR/Admin also receive inactive badges.
      operationId: getBadges
      responses:
        '200':
          description: Badges retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Badges retrieved
                data:
                  - id: 1
                    name: "Innovator"
                    description: "For creative problem solving"
                    icon_url: "https://cdn.example.com/badges/innovator.png"
                    is_active: true
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - recognitions
      summary: Create Badge
      description: Creates a new badge (HR/Admin only).
      operationId: createBadge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeCreate'
      responses:
        '201':
          description: Badge created
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 201
                message: Badge created successfully
                data:
                  id: 10
                  name: "Rising Star"
                  description: "For outstanding new joiners"
                  icon_url: "https://cdn.example.com/badges/rising-star.png"
                  is_active: true
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict – badge name already exists
          content:
            application/json:
              schema:
                type: object
              example:
                status: error
                status_code: 409
                message: Badge name already exists

  /recognitions/badges/{badge_id}:
    put:
      tags:
        - recognitions
      summary: Update Badge
      description: Updates a badge's details (HR/Admin only).
      operationId: updateBadge
      parameters:
        - name: badge_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeUpdate'
      responses:
        '200':
          description: Badge updated
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Badge updated
                data:
                  id: 10
                  name: "Rising Star"
                  is_active: false
                timestamp: "2025-01-15T10:30:00"
        '401':
