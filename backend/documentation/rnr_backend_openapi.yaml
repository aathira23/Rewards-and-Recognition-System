              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Feature flags retrieved
                data:
                  conversion_enabled: true
                  catalog_enabled: true
                  celebrations_enabled: true
                  awards_enabled: true
                timestamp: "2025-01-15T10:30:00"

  /config/{key}:
    put:
      tags:
        - config
      summary: Update Configuration
      description: Updates a single system configuration value (HR/Admin only).
      operationId: updateConfig
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            example: max_monthly_recognitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfigUpdate'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: "Config 'max_monthly_recognitions' updated"
                data:
                  key: "max_monthly_recognitions"
                  value: "10"
                  description: "Maximum recognitions per month"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ─────────────────────── DEPARTMENTS ───────────────────────

  /departments/:
    get:
      tags:
        - departments
      summary: List Departments
      description: Returns all departments. Available to all authenticated users.
      operationId: listDepartments
      responses:
        '200':
          description: Departments retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Departments retrieved
                data:
                  - id: 1
                    name: "Engineering"
                    created_at: "2024-01-01T00:00:00"
                  - id: 2
                    name: "Design"
                    created_at: "2024-01-01T00:00:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - departments
      summary: Create Department
      description: Creates a new department (HR/Admin only).
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 201
                message: Department created
                data:
                  id: 5
                  name: "Product"
                  created_at: "2025-01-15T10:30:00"
                timestamp: "2025-01-15T10:30:00"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /departments/{dept_id}:
    put:
      tags:
        - departments
      summary: Update Department
      description: Updates a department's name (HR/Admin only).
      operationId: updateDepartment
      parameters:
        - name: dept_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Department updated
                data:
                  id: 5
                  name: "Product & Design"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - departments
      summary: Delete Department
      description: Deletes a department (HR/Admin only).
      operationId: deleteDepartment
      parameters:
        - name: dept_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Department deleted
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Department deleted successfully
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ─────────────────────── CELEBRATIONS ───────────────────────

  /celebrations/upcoming:
    get:
      tags:
        - celebrations
      summary: Upcoming Celebrations
      description: Returns upcoming birthdays and work anniversaries within the next N days.
      operationId: getUpcomingCelebrations
      parameters:
        - name: days
          in: query
          required: false
          description: How many days ahead to look (default 7)
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Upcoming celebrations retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Celebrations fetched
                data:
                  - id: 1
                    user_id: 8
                    user_name: "Emma Clark"
                    celebration_type: BIRTHDAY
                    celebration_date: "2025-01-18"
                    years: null
                  - id: 2
                    user_id: 3
                    user_name: "Carlos Rivera"
                    celebration_type: WORK_ANNIVERSARY
                    celebration_date: "2025-01-20"
                    years: 3
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /celebrations/history:
    get:
      tags:
        - celebrations
      summary: Celebration History
      description: Returns paginated past celebration records.
      operationId: getCelebrationHistory
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Celebration history retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Celebration history fetched
                data:
                  items:
                    - id: 1
                      user_id: 8
                      user_name: "Emma Clark"
                      celebration_type: BIRTHDAY
                      celebration_date: "2025-01-01"
                  page: 1
                  per_page: 20
                  total: 48
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /celebrations/process-today:
    post:
      tags:
        - celebrations
      summary: Process Today's Celebrations
      description: Manually triggers processing of today's birthdays and work anniversaries – sends notifications and points (HR/Admin only).
      operationId: processTodayCelebrations
      responses:
        '200':
          description: Celebrations processed
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: "Processed 2 birthdays and 1 anniversaries"
                data:
                  birthdays: 2
                  anniversaries: 1
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ─────────────────────── EMAIL ───────────────────────

  /email/logs:
    get:
      tags:
        - email
      summary: Email Logs
      description: Returns paginated email send history (HR only).
      operationId: getEmailLogs
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Email logs retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Email logs retrieved
                data:
                  - id: 301
                    to_email: "alice@company.com"
                    template_name: "ecard_received"
                    status: SENT
                    sent_at: "2025-01-14T09:05:00"
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /email/test-send:
    post:
      tags:
        - email
      summary: Send Test Email
      description: Renders a template file with the provided context and sends a test email (HR only).
      operationId: sendTestEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTestEmailRequest'
      responses:
        '200':
          description: Test email dispatched
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                status_code: 200
                message: Test email dispatched
                data:
                  status: SENT
                  log_id: 302
                timestamp: "2025-01-15T10:30:00"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Template file not found or send failed
          content:
            application/json:
              schema:
                type: object
              example:
                status: error
                status_code: 422
                message: "Template file not found or send failed."

# ─────────────────────── COMPONENTS ───────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Auth ──
    LoginForm:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: User email address
          example: alice@company.com
        password:
          type: string
          format: password
          example: "S3cur3P@ssw0rd"

    # ── Users ──
    UserCreate:
      type: object
      required:
        - name
        - email
        - role
        - password
      properties:
        name:
          type: string
          example: "Carol White"
        email:
          type: string
          format: email
          example: "carol@company.com"
        role:
          type: string
          enum: [EMPLOYEE, MANAGER, DEPT_HEAD, HR, ADMIN]
          example: EMPLOYEE
        password:
          type: string
          format: password
        department_id:
          type: integer
          nullable: true
          example: 3
        manager_id:
          type: integer
          nullable: true
          example: 5
        date_of_joining:
          type: string
          format: date
          nullable: true
          example: "2025-01-15"
        birth_date:
          type: string
          format: date
          nullable: true
          example: "1994-06-20"

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          enum: [EMPLOYEE, MANAGER, DEPT_HEAD, HR, ADMIN]
          nullable: true
        department_id:
          type: integer
          nullable: true
        manager_id:
          type: integer
          nullable: true
        date_of_joining:
          type: string
          format: date
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true

    # ── Budgets/Wallets ──
    WalletAllocateRequest:
      type: object
      required:
        - manager_id
        - points
      properties:
        manager_id:
          type: integer
          example: 5
        points:
          type: integer
          example: 500

    WalletRewardRequest:
      type: object
      required:
        - employee_id
        - points
        - reason
      properties:
        employee_id:
          type: integer
          example: 8
        points:
          type: integer
          example: 100
        reason:
          type: string
          example: "Excellent delivery on the Q4 sprint"

    BulkBudgetAllocationRequest:
      type: object
      required:
        - points
      properties:
        points:
          type: integer
          example: 500
        department_id:
          type: integer
          nullable: true
          example: 3
        user_ids:
          type: array
          items:
            type: integer
          nullable: true
          example: [5, 7, 12]
        role_filter:
          type: string
          nullable: true
          example: MANAGER

    # ── Points Conversion ──
    PointsConversionCreate:
      type: object
      required:
        - points_converted
        - conversion_type
      properties:
        points_converted:
          type: integer
          example: 500
        conversion_type:
          type: string
          enum: [CASH, PAYROLL]
          example: CASH

    ConversionActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
          example: APPROVE
        comments:
          type: string
          nullable: true
          example: "Approved for January payroll cycle"

    # ── Points Policy ──
    PointsPolicyCreate:
      type: object
      required:
        - recognition_type
        - points_allocated
      properties:
        recognition_type:
          type: string
          example: PEER
        points_allocated:
          type: integer
          example: 50
        conversion_rate:
          type: number
          format: float
          nullable: true
          example: 0.1
        conversion_reward_type:
          type: string
          nullable: true
          example: CASH
        is_active:
          type: boolean
          default: true

    PointsPolicyUpdate:
      type: object
      properties:
        points_allocated:
          type: integer
          nullable: true
        conversion_rate:
          type: number
          format: float
          nullable: true
        is_active:
          type: boolean
          nullable: true

    # ── Recognitions / eCards ──
    ECardCreate:
      type: object
      required:
        - receiver_id
        - badge_id
        - message
      properties:
        receiver_id:
          type: integer
          example: 9
        badge_id:
          type: integer
          example: 3
        message:
          type: string
          example: "Brilliant work on the dashboard — really raised the bar!"

    BadgeCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Rising Star"
        description:
          type: string
          nullable: true
          example: "For outstanding new joiners showing exceptional initiative"
        icon_url:
          type: string
          nullable: true
          example: "https://cdn.example.com/badges/rising-star.png"

    BadgeUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        icon_url:
          type: string
          nullable: true
        is_active:
          type: boolean
          nullable: true

    # ── Awards ──
    AwardTypeCreate:
      type: object
      required:
        - award_key
        - name
        - points
        - frequency
        - eligibility_rule
      properties:
        award_key:
          type: string
          example: "SPOT"
        name:
          type: string
          example: "Spot Award"
        description:
          type: string
          nullable: true
          example: "For immediate recognition of outstanding contributions"
        points:
          type: integer
          example: 100
        frequency:
          type: string
          enum: [MONTHLY, QUARTERLY, ADHOC]
          example: ADHOC
        eligibility_rule:
          type: string
          enum: [MANAGER_ONLY, PEER, SENIOR_MGMT]
          example: PEER
        approval_workflow:
          type: array
          items:
            type: string
            enum: [MANAGER, DEPT_HEAD, HR]
          nullable: true
          example: [MANAGER]
        is_active:
          type: boolean
          default: true

    AwardTypeUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        points:
          type: integer
          nullable: true
        frequency:
          type: string
          enum: [MONTHLY, QUARTERLY, ADHOC]
          nullable: true
        eligibility_rule:
          type: string
          enum: [MANAGER_ONLY, PEER, SENIOR_MGMT]
          nullable: true
        approval_workflow:
          type: array
          items:
            type: string
          nullable: true
        is_active:
          type: boolean
          nullable: true

    AwardNominationCreate:
      type: object
      required:
        - nominee_id
        - award_type_id
      properties:
        nominee_id:
          type: integer
          example: 8
        award_type_id:
          type: integer
          example: 1
        citation:
          type: string
          nullable: true
          example: "Led the Q4 release single-handedly under tight deadlines"

    AwardActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
          example: APPROVE
        comments:
          type: string
          nullable: true
          example: "Strong performance, well deserved"

    # ── Catalog / Store ──
    RewardCreate:
      type: object
      required:
        - name
        - points_required
      properties:
        name:
          type: string
          example: "Movie Voucher"
        description:
          type: string
          nullable: true
          example: "Single-use PVR movie voucher worth ₹300"
        points_required:
          type: integer
          example: 300
        category:
          type: string
          nullable: true
          example: "VOUCHER"
        image_url:
          type: string
          nullable: true
          example: "https://cdn.example.com/pvr.png"
        is_active:
          type: boolean
          default: true

    RewardUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        points_required:
          type: integer
          nullable: true
        category:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
          nullable: true

    RedemptionCreate:
      type: object
      required:
        - reward_id
      properties:
        reward_id:
          type: integer
          example: 1

    # ── Notifications ──
    MarkReadRequest:
      type: object
      properties:
        notification_id:
          type: integer
          nullable: true
          description: If null or omitted, all unread notifications are marked as read
          example: 201

    # ── Departments ──
    DepartmentCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Product"

    DepartmentUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Product & Design"

    # ── System Config ──
    SystemConfigUpdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          example: "10"
        description:
          type: string
          nullable: true
          example: "Maximum recognitions an employee can send per month"

    # ── Email ──
    SendTestEmailRequest:
      type: object
      required:
        - to_email
        - template_name
      properties:
        to_email:
          type: string
          format: email
          example: "hr@company.com"
        template_name:
          type: string
          example: "ecard_received"
          description: Name of the email template file (without extension)
        context:
          type: object
          nullable: true
          description: Template variable substitutions
          example:
            sender_name: "Alice Johnson"
            badge_name: "Team Player"
            message: "Great work on the sprint!"

    # ── Shared Response Envelope ──
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        status_code:
          type: integer
          example: 200
        message:
          type: string
          example: "Operation completed successfully"
        data:
          description: Response payload (object or array, varies per endpoint)
        timestamp:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00"

  responses:
    UnauthorizedError:
      description: Unauthorized – missing or invalid JWT token
      content:
        application/json:
          schema:
            type: object
            example:
              status: error
              status_code: 401
              message: "Could not validate credentials"
              data: null
              timestamp: "2025-01-15T10:30:00"

    ForbiddenError:
      description: Forbidden – user does not have the required role
      content:
        application/json:
          schema:
            type: object
            example:
              status: error
              status_code: 403
              message: "Access denied"
              data: null
              timestamp: "2025-01-15T10:30:00"

    NotFoundError:
      description: Not Found – the requested resource does not exist
      content:
        application/json:
          schema:
            type: object
            example:
              status: error
              status_code: 404
              message: "Resource not found"
              data: null
              timestamp: "2025-01-15T10:30:00"

    BadRequestError:
      description: Bad Request – invalid input or business logic violation
      content:
        application/json:
          schema:
            type: object
            example:
              status: error
              status_code: 400
              message: "Validation failed"
              data: null
              timestamp: "2025-01-15T10:30:00"
